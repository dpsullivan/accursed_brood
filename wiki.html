<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accursed Brood — Companion Wiki</title>
  <link rel="stylesheet" href="wiki/styles.css" />
</head>
<body class="brood-chronicle">
  <div id="wiki-root"></div>
  <div id="wiki-modal-root"></div>

  <!-- Hidden file picker for loading external Seed Manifest JSON -->
  <input type="file" id="wiki-file-input" accept=".json,application/json" style="display:none" />

  <!-- Classic script loading for zero-server file:// compatibility (ADR 0002) -->
  <script src="wiki/data.js"></script>
  <script src="wiki/render.js"></script>
  <script src="wiki/app.js"></script>
  <!-- Optional auto-discovered local seed registry generated by randomizer.py -->
  <script src="output/seeds/registry.js" onerror="window.__ACCURSED_BROOD_WIKI__ && window.__ACCURSED_BROOD_WIKI__.onRegistryMissing()"></script>
</body>
</html>
